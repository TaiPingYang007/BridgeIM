services:
  redis:
    image: redis:7.2-alpine
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redis_dev_password}"
    command:
      [
        "sh",
        "-c",
        "exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$${REDIS_PASSWORD}\"",
      ]
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - chatserver_net

  # ZooKeeper: 复用 03_rpc_framework 项目的容器，端口 2181
  # 如需独立启动，取消下方注释并停掉 03 的 ZK 容器
