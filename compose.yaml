  #   ports:
  #     - "2181:2181"
  #   environment:
  #     ZOO_4LW_COMMANDS_WHITELIST: "srvr,ruok"
  #   volumes:
  #     - zk_data:/data
  #     - zk_datalog:/datalog
  #   healthcheck:
  #     test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10
  #     start_period: 10s
  #   restart: unless-stopped
  #   networks:
  #     - chatserver_net

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:8000"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - chatserver_net

volumes:
  redis_data:
  zk_data:
  zk_datalog:

networks:
  chatserver_net:
